<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Arcade — 2-Player Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="app.css" />
</head>
<body class="min-h-[100dvh] bg-slate-950 text-slate-100 flex flex-col">

  <!-- header -->
  <header class="sticky top-0 z-10 backdrop-blur bg-slate-950/80 border-b border-slate-800 px-4 py-3 flex items-center justify-between"
          style="padding-top: max(0.75rem, env(safe-area-inset-top));">
    <button id="btn-home" class="font-black text-lg tracking-tight text-indigo-400">◆ ARCADE</button>
    <div class="flex items-center gap-3">
      <span id="status" class="text-xs text-slate-400"></span>
      <button id="btn-prefs" class="text-xl leading-none" title="Settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main class="flex-1 w-full max-w-lg mx-auto px-4 py-5"
        style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom));">

    <!-- HOME -->
    <section id="screen-home" class="space-y-4">
      <div class="hero-card rounded-2xl p-5 border border-slate-800">
        <h1 class="text-2xl font-black mb-1" data-i18n="pick_game">Pick a game</h1>
        <p class="text-slate-300/80 text-sm" data-i18n="tagline">2 players · peer-to-peer · no sign-up</p>
      </div>
      <input id="game-search" data-i18n-ph="search_ph" placeholder="Search games…"
             class="w-full py-2.5 px-4 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 placeholder:text-slate-500" />
      <div id="cat-chips" class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1"></div>
      <div id="game-sections"></div>
    </section>

    <!-- CONNECT (pre-connection: create or join) -->
    <section id="screen-connect" class="hidden space-y-4">
      <h2 id="connect-title" class="text-xl font-bold"></h2>
      <div class="bg-slate-800/60 border border-slate-700 rounded-xl p-4">
        <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-400 mb-1" data-i18n="how_to_play">How to play</h3>
        <p id="howto-text" class="text-sm text-slate-300 leading-relaxed"></p>
        <div id="howto-demo" class="mt-3 min-h-[4.5rem] flex items-center justify-center"></div>
      </div>
      <button id="btn-create" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold transition" data-i18n="create_room">Create a Room</button>
      <div class="flex items-center gap-2 text-slate-500 text-xs"><div class="flex-1 h-px bg-slate-800"></div><span data-i18n="or">OR</span><div class="flex-1 h-px bg-slate-800"></div></div>
      <input id="join-code" maxlength="6" placeholder="ENTER ROOM CODE" data-i18n-ph="enter_code"
             class="w-full py-3 px-4 rounded-xl bg-slate-800 text-center tracking-widest uppercase placeholder:tracking-normal placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button id="btn-join" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold transition" data-i18n="join_room">Join Room</button>
      <button id="btn-back-connect" class="w-full py-2 text-sm text-slate-500 hover:text-slate-300" data-i18n="back_games">← Back to games</button>
    </section>

    <!-- LOBBY -->
    <section id="screen-lobby" class="hidden space-y-5">
      <div id="lobby-host"><h2 class="font-semibold mb-3" data-i18n="game_settings">Game Settings</h2><div id="lobby-options"></div></div>
      <div class="bg-slate-900 rounded-2xl p-4 text-center border border-slate-800">
        <p class="text-xs text-slate-400 mb-1" data-i18n="room_code">Room code</p>
        <p id="room-code" class="text-3xl font-mono font-bold tracking-widest text-indigo-400">------</p>
        <button id="btn-copy" class="mt-3 text-sm py-2 px-4 rounded-lg bg-slate-800 hover:bg-slate-700 transition" data-i18n="copy_link">Copy invite link</button>
      </div>
      <button id="btn-start" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed" data-i18n="start_game">Start Game</button>
      <p id="lobby-wait" class="hidden text-center text-slate-400 text-sm" data-i18n="waiting_host">Waiting for host to start…</p>
      <button id="btn-back-lobby" class="w-full py-2 text-sm text-slate-500 hover:text-slate-300" data-i18n="leave_room">← Leave room</button>
    </section>

    <!-- SETUP -->
    <section id="screen-setup" class="hidden space-y-4">
      <h2 id="setup-title" class="text-lg font-bold text-center"></h2>
      <div id="setup-root"></div>
    </section>

    <!-- COIN TOSS -->
    <section id="screen-toss" class="hidden text-center py-10 space-y-4">
      <div id="coin" class="mx-auto w-24 h-24 rounded-full bg-gradient-to-br from-yellow-400 to-amber-600 flex items-center justify-center text-3xl font-bold text-amber-900">?</div>
      <p id="toss-result" class="text-lg font-semibold">Tossing…</p>
    </section>

    <!-- PLAY -->
    <section id="screen-play" class="hidden space-y-4 relative">
      <div class="flex items-center justify-between">
        <span id="game-title" class="text-sm font-semibold text-slate-300"></span>
        <div class="flex items-center gap-3">
          <button id="btn-change" class="text-sm text-slate-400 hover:text-slate-200 w-6 h-6 rounded-full border border-slate-600" title="Change game" aria-label="Change game">⇄</button>
          <button id="btn-help" class="text-sm text-slate-400 hover:text-slate-200 w-6 h-6 rounded-full border border-slate-600" title="How to play" aria-label="How to play">?</button>
          <button id="btn-home-play" class="text-xs text-slate-500 hover:text-slate-300" data-i18n="quit">Quit</button>
        </div>
      </div>
      <div id="turn-bar" class="flex items-center justify-between gap-2 bg-slate-900 rounded-xl px-4 py-2 border border-slate-800">
        <span id="turn-label" class="font-semibold flex-1"></span>
        <span id="timer" class="font-mono text-xl px-3 py-1 rounded-lg bg-slate-950">--</span>
        <button id="btn-pause" class="text-sm px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700" title="Pause">⏸</button>
      </div>

      <!-- result header (shown in place of the turn bar when the match ends; board stays below) -->
      <div id="result-bar" class="hidden bg-slate-900 rounded-xl p-3 border border-slate-700 space-y-2">
        <p id="result-text" class="text-center text-lg font-bold"></p>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-rematch" class="py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 font-semibold transition" data-i18n="rematch">Rematch</button>
          <button id="btn-result-change" class="py-2.5 rounded-lg bg-slate-700 hover:bg-slate-600 font-semibold transition" data-i18n="change_game">Change game</button>
        </div>
        <button id="btn-result-home" class="w-full py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm transition" data-i18n="back_games">Back to games</button>
      </div>

      <div id="game-root"></div>

      <!-- pause / reconnect overlay -->
      <div id="pause-overlay" class="hidden absolute inset-0 z-10 flex flex-col items-center justify-center gap-4 rounded-2xl bg-slate-950/85 backdrop-blur-sm text-center px-6">
        <div class="text-5xl">⏸️</div>
        <p id="pause-msg" class="text-lg font-semibold">Paused</p>
        <button id="btn-resume" class="w-full max-w-xs py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold transition" data-i18n="resume">Resume</button>
        <button id="btn-pause-leave" class="w-full max-w-xs py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm transition" data-i18n="leave_game">Leave game</button>
      </div>
    </section>
  </main>

  <!-- SETTINGS PANEL -->
  <div id="prefs-panel" class="hidden fixed inset-0 z-30 flex items-end sm:items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-2xl p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold" data-i18n="prefs">Settings</h2>
        <button id="btn-prefs-close" class="text-slate-400 hover:text-slate-200 text-xl leading-none">✕</button>
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1" data-i18n="language">Language</label>
        <div class="flex gap-2">
          <button id="btn-lang-en" class="flex-1 py-2 rounded-lg font-semibold bg-indigo-600">English</button>
          <button id="btn-lang-ar" class="flex-1 py-2 rounded-lg font-semibold bg-slate-800 text-slate-400">العربية</button>
        </div>
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1" data-i18n="display_name">Your name</label>
        <input id="pref-name" maxlength="16" class="w-full py-2 px-3 rounded-lg bg-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div class="flex items-center justify-between">
        <label class="text-sm text-slate-400" data-i18n="theme">Theme</label>
        <div id="theme-swatches" class="flex gap-2"></div>
      </div>
      <div class="flex items-center justify-between">
        <label class="text-sm text-slate-400" data-i18n="sound">Sound</label>
        <button id="btn-sound-toggle" class="px-4 py-2 rounded-lg font-semibold bg-emerald-600">On</button>
      </div>
      <div class="flex items-center justify-between">
        <label class="text-sm text-slate-400" data-i18n="haptics">Vibration</label>
        <button id="btn-haptics-toggle" class="px-4 py-2 rounded-lg font-semibold bg-emerald-600">On</button>
      </div>
      <button id="btn-prefs-close2" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold" data-i18n="close">Close</button>
    </div>
  </div>

  <!-- IN-GAME HELP -->
  <div id="help-panel" class="hidden fixed inset-0 z-30 flex items-center justify-center bg-slate-950/70 backdrop-blur-sm p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-700 rounded-2xl p-5 space-y-3">
      <div class="flex items-center justify-between">
        <h2 id="help-title" class="text-lg font-bold"></h2>
        <button id="btn-help-close" class="text-slate-400 hover:text-slate-200 text-xl leading-none">✕</button>
      </div>
      <p id="help-rules" class="text-sm text-slate-300 leading-relaxed"></p>
      <div id="help-demo" class="min-h-[4.5rem] flex items-center justify-center"></div>
      <button id="btn-help-close2" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold" data-i18n="close">Close</button>
    </div>
  </div>

  <!-- IN-ROOM GAME PICKER -->
  <div id="picker-panel" class="hidden fixed inset-0 z-30 flex items-end sm:items-center justify-center bg-slate-950/80 backdrop-blur-sm p-3">
    <div class="w-full max-w-lg max-h-[85vh] flex flex-col bg-slate-900 border border-slate-700 rounded-2xl p-4">
      <div class="flex items-center justify-between mb-1">
        <h2 class="text-lg font-bold" data-i18n="change_game">Change game</h2>
        <button id="btn-picker-cancel" class="text-slate-400 hover:text-slate-200 text-xl leading-none">✕</button>
      </div>
      <p id="picker-note" class="text-xs text-slate-400 mb-3" data-i18n="picker_note">You'll stay in the room — this ends the current game.</p>
      <div id="picker-list" class="overflow-y-auto flex-1 -mx-1 px-1"></div>
      <button id="btn-picker-cancel2" class="mt-3 w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold" data-i18n="cancel">Cancel</button>
    </div>
  </div>

  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-sm px-4 py-2 rounded-lg shadow-lg border border-slate-700 z-40"></div>

  <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
