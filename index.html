<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Arcade — 2-Player Games</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="app.css" />
</head>
<body class="min-h-[100dvh] bg-slate-950 text-slate-100 flex flex-col">

  <!-- header -->
  <header class="sticky top-0 z-10 backdrop-blur bg-slate-950/80 border-b border-slate-800 px-4 py-3 flex items-center justify-between"
          style="padding-top: max(0.75rem, env(safe-area-inset-top));">
    <button id="btn-home" class="font-black text-lg tracking-tight text-indigo-400">◆ ARCADE</button>
    <span id="status" class="text-xs text-slate-400"></span>
  </header>

  <main class="flex-1 w-full max-w-lg mx-auto px-4 py-5"
        style="padding-bottom: max(1.25rem, env(safe-area-inset-bottom));">

    <!-- HOME -->
    <section id="screen-home">
      <h1 class="text-2xl font-black mb-1">Pick a game</h1>
      <p class="text-slate-400 text-sm mb-5">2 players · peer-to-peer · no sign-up</p>
      <div id="game-grid" class="grid grid-cols-2 gap-3"></div>
    </section>

    <!-- CONNECT (pre-connection: create or join) -->
    <section id="screen-connect" class="hidden space-y-4">
      <h2 id="connect-title" class="text-xl font-bold"></h2>
      <button id="btn-create" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold transition">Create a Room</button>
      <div class="flex items-center gap-2 text-slate-500 text-xs"><div class="flex-1 h-px bg-slate-800"></div>OR<div class="flex-1 h-px bg-slate-800"></div></div>
      <input id="join-code" maxlength="6" placeholder="ENTER ROOM CODE"
             class="w-full py-3 px-4 rounded-xl bg-slate-800 text-center tracking-widest uppercase placeholder:tracking-normal placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <button id="btn-join" class="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 font-semibold transition">Join Room</button>
      <button id="btn-back-connect" class="w-full py-2 text-sm text-slate-500 hover:text-slate-300">← Back to games</button>
    </section>

    <!-- LOBBY -->
    <section id="screen-lobby" class="hidden space-y-5">
      <div id="lobby-host"><h2 class="font-semibold mb-3">Game Settings</h2><div id="lobby-options"></div></div>
      <div class="bg-slate-900 rounded-2xl p-4 text-center border border-slate-800">
        <p class="text-xs text-slate-400 mb-1">Room code</p>
        <p id="room-code" class="text-3xl font-mono font-bold tracking-widest text-indigo-400">------</p>
        <button id="btn-copy" class="mt-3 text-sm py-2 px-4 rounded-lg bg-slate-800 hover:bg-slate-700 transition">Copy invite link</button>
      </div>
      <button id="btn-start" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold transition disabled:opacity-40 disabled:cursor-not-allowed">Start Game</button>
      <p id="lobby-wait" class="hidden text-center text-slate-400 text-sm">Waiting for host to start…</p>
      <button id="btn-back-lobby" class="w-full py-2 text-sm text-slate-500 hover:text-slate-300">← Leave room</button>
    </section>

    <!-- SETUP -->
    <section id="screen-setup" class="hidden space-y-4">
      <h2 id="setup-title" class="text-lg font-bold text-center"></h2>
      <div id="setup-root"></div>
    </section>

    <!-- COIN TOSS -->
    <section id="screen-toss" class="hidden text-center py-10 space-y-4">
      <div id="coin" class="mx-auto w-24 h-24 rounded-full bg-gradient-to-br from-yellow-400 to-amber-600 flex items-center justify-center text-3xl font-bold text-amber-900">?</div>
      <p id="toss-result" class="text-lg font-semibold">Tossing…</p>
    </section>

    <!-- PLAY -->
    <section id="screen-play" class="hidden space-y-4 relative">
      <div class="flex items-center justify-between">
        <span id="game-title" class="text-sm font-semibold text-slate-300"></span>
        <button id="btn-home-play" class="text-xs text-slate-500 hover:text-slate-300">Quit</button>
      </div>
      <div id="turn-bar" class="flex items-center justify-between gap-2 bg-slate-900 rounded-xl px-4 py-2 border border-slate-800">
        <span id="turn-label" class="font-semibold flex-1"></span>
        <span id="timer" class="font-mono text-xl px-3 py-1 rounded-lg bg-slate-950">--</span>
        <button id="btn-pause" class="text-sm px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700" title="Pause">⏸</button>
      </div>
      <div id="game-root"></div>

      <!-- pause / reconnect overlay -->
      <div id="pause-overlay" class="hidden absolute inset-0 z-10 flex flex-col items-center justify-center gap-4 rounded-2xl bg-slate-950/85 backdrop-blur-sm text-center px-6">
        <div class="text-5xl">⏸️</div>
        <p id="pause-msg" class="text-lg font-semibold">Paused</p>
        <button id="btn-resume" class="w-full max-w-xs py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-semibold transition">Resume</button>
        <button id="btn-pause-leave" class="w-full max-w-xs py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm transition">Leave game</button>
      </div>
    </section>

    <!-- GAME OVER -->
    <section id="screen-over" class="hidden text-center py-10 space-y-4">
      <div id="over-emoji" class="text-6xl">🏆</div>
      <h2 id="over-title" class="text-2xl font-bold"></h2>
      <p id="over-sub" class="text-slate-400"></p>
      <button id="btn-rematch" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-semibold transition">Rematch</button>
      <button id="btn-over-home" class="w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-sm transition">← Back to games</button>
    </section>
  </main>

  <div id="toast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-sm px-4 py-2 rounded-lg shadow-lg border border-slate-700 z-20"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
